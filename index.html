
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título, description, canonical, og:* e JSON-LD saem por rota:
         src/seo/Seo.tsx no navegador, plugins/prerender.ts no HTML estático.
         O bloco entre os marcadores é substituído no build; não coloque
         meta de página aqui, ou ela aparece duplicada. -->
    <!--seo-head-start--><title>Sapient.IA</title><!--seo-head-end-->

    <link rel="icon" type="image/png" href="/lovable-uploads/c31755cd-4460-4a4c-9fee-bf80629fc090.png" />
    <!-- As fontes agora são auto-hospedadas (src/design/fonts.css); nada de
         Google Fonts, nenhuma requisição a terceiro no caminho da primeira
         pintura. -->

    <!-- Tema, antes da primeira pintura.
         Precisa ser inline e síncrono aqui: o React só monta depois do bundle
         carregar, e até lá a página já pintou. Quem escolheu claro veria um
         lampejo escuro em cada visita. O `catch` cobre navegação privada, onde
         ler o localStorage lança exceção em vez de devolver vazio. -->
    <script>
      try {
        if (localStorage.getItem('sapient-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
